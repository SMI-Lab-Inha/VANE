# Read the Docs build configuration for VANE.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

# Offer the manual as downloadable PDF and EPUB alongside the HTML site.
formats:
  - pdf
  - epub
