[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vane"
version = "0.1.0"
description = "OpenFAST linearization post-processing, physics-based mode identification, Campbell diagrams and state-space export for wind turbines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jae Hoon Seo", email = "jaehoon.seo@inha.ac.kr" }]
maintainers = [{ name = "Jae Hoon Seo", email = "jaehoon.seo@inha.ac.kr" }]
keywords = [
    "OpenFAST",
    "wind turbine",
    "floating offshore wind",
    "linearization",
    "modal analysis",
    "mode identification",
    "Campbell diagram",
    "MBC3",
    "Floquet",
    "state space",
    "Kalman filter",
    "digital twin",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/SMI-Lab-Inha/VANE"
Documentation = "https://vane.readthedocs.io"
Repository = "https://github.com/SMI-Lab-Inha/VANE"
Issues = "https://github.com/SMI-Lab-Inha/VANE/issues"
Changelog = "https://github.com/SMI-Lab-Inha/VANE/blob/main/CHANGELOG.md"
Releases = "https://github.com/SMI-Lab-Inha/VANE/releases"

[project.scripts]
vane = "vane.cli:app"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
pdf = ["weasyprint>=60"]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
]
dev = [
    "ruff>=0.15,<0.16",
    "mypy>=1.10",
    "pytest>=7",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "pre-commit>=3",
    "build>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so that type checkers use VANE's inline annotations.
vane = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vane --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["vane"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
